# This config file include the input devices and custom hotkeys/keybinds

#====== Funktion-keys ======#
# Brightness Control
bind=	,XF86MonBrightnessDown, exec,  brightnessctl set 5%-  # F05
bind=	,XF86MonBrightnessUp, exec,  brightnessctl set 5%+  # F06

# Audio Control
bind=,  XF86AudioPlay, exec, playerctl --all-players play-pause  # F04
bind=,  XF86AudioPause, exec, playerctl --all-players play-pause  # F04
bind=,  XF86AudioMute, exec, wpctl set-mute @DEFAULT_SINK@ toggle  # F01
bind=,  XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_SINK@ 5%- -l 1  # F02
bind=,  XF86AudioRaiseVolume,  exec, wpctl set-volume @DEFAULT_SINK@ 5%+ -l 1  # F03

# Microphone Control
bind=,  XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle  # F04

# disable screen
bind=,  XF86Display, exec, hyprctl dispatch dpms toggle  # F09

# Quick-Start
# bind=,  XF86NotificationCenter, exec, # F07
# bind=,  XF86PickupPhone,        exec, # F10
# bind=,  XF86HangupPhone,        exec, # F11
# bind=,  XF86Favorites,          exec, # F12

#====== Input-device config ======#
input {
  kb_layout = de
  kb_variant  = us  # specific keymap paramkb_options
  kb_options  = caps:hyper  # bind caps to sup
  follow_mouse  = 2
  accel_profile = flat
  sensitivity = 0
  touchpad {
    natural_scroll	= yes
  }
}

# trackpad gesture config
gestures {
    workspace_swipe = on  # activates 3 finger swipe for workspacechange
}

#====== Keybinds ======#
$mainMod = Mod3
# See https://wiki.hyprland.org/Configuring/Keywords/
# or for example binds see https://wiki.hyprland.org/Configuring/Binds/

#---focus-movement---#
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u

bind = $mainMod ALT, h, focusmonitor, l
bind = $mainMod ALT, l, focusmonitor, r
bind = $mainMod ALT, j, focusmonitor, d
bind = $mainMod ALT, k, focusmonitor, u

#---Workspace-movement---#
#normal movement
bind = $mainMod ALT, h, workspace, m:l
bind = $mainMod ALT, l, workspace, m:r
bind = $mainMod ALT, j, workspace, m:d
bind = $mainMod	ALT, k, workspace, m:u

bind = $mainMod ALT,  left, workspace, m:l
bind = $mainMod ALT, right, workspace, m:r
bind = $mainMod ALT,  down, workspace, m:d
bind = $mainMod ALT,    up, workspace, m:u

bind = $mainMod,   mouse_up, workspace, m-1
bind = $mainMod, mouse_down, workspace, m+1

# Switch to a specific workspace with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, g, workspace, name:game

#---Window-movement---#
# relative window movement
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, j, movewindow, d
bind = $mainMod SHIFT, k, movewindow, u

bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT,  left, movewindow, l
bind = $mainMod SHIFT,  down, movewindow, d
bind = $mainMod SHIFT,    up, movewindow, u

bind = $mainMod SHIFT ALT, h, movewindow, m:r
bind = $mainMod	Shift ALT, l, movewindow, m:l
bind = $mainMod SHIFT ALT, j, movewindow, m:d
bind = $mainMod SHIFT ALT, k, movewindow, m:u

bind = $mainMod SHIFT ALT, right, movewindow, m:r
bind = $mainMod SHIFT ALT,  left, movewindow, m:l
bind = $mainMod SHIFT ALT,  down, movewindow, m:d
bind = $mainMod SHIFT ALT,    up, movewindow, m:u

# move to next available empty workspace
bind = $mainMod SHIFT, n, movetoworkspace, emptynm

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT       , 1           , movetoworkspace , 1
bind = $mainMod SHIFT       , 2           , movetoworkspace , 2
bind = $mainMod SHIFT       , 3           , movetoworkspace , 3
bind = $mainMod SHIFT       , 4           , movetoworkspace , 4
bind = $mainMod SHIFT       , 5           , movetoworkspace , 5
bind = $mainMod SHIFT       , 6           , movetoworkspace , 6
bind = $mainMod SHIFT       , 7           , movetoworkspace , 7
bind = $mainMod SHIFT       , 8           , movetoworkspace , 8
bind = $mainMod SHIFT       , 9           , movetoworkspace , 9
bind = $mainMod SHIFT       , 0           , movetoworkspace , 10
bind = $mainMod SHIFT       , g           , movetoworkspace , name:game

#---Window-modification---#
# mouse
bindm = $mainMod , mouse:272 , movewindow
bindm = $mainMod , mouse:273 , resizewindow

# hotkeys
bind = $mainMod, D, killactive,
bind = $mainMod, F, fullscreen,
bind = $mainMod, O, togglesplit,
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,

#---Specific-keybinds---#
# Hyprland-specific
#bind = $mainMod, M, exit,
bind = $mainMod, B, exec, toggle-waybar toggle

bind = $mainMod SHIFT,     R, exec, hyprctl reload; chwp -r
bind = $mainMod SHIFT,     M, exec, hyprctl dispatch dpms toggle
bind = $mainMod SHIFT ALT, S, exec, shutdown 0
# bind = $mainMod sLT, L, exec, loginctl lock-session

# Screenshot / color-picker
bind = SHIFT, Print, exec, grim -g "$(slurp)" - | wl-copy
bind =      , Print, exec, grim -g "$(slurp)" - | swappy -f -
bind =   ALT, Print, exec, wl-copy $(hyprpicker)

#terminal
bind = $mainMod, Q, exec, kitty -e tmux new-session -A -s default

#file-browser
bind = $mainMod SHIFT,     E, exec, thunar
bind = $mainMod,     E, exec, hyprctl clients | grep -q "class: kitty" && { tmux neww superfile && hyprctl dispatch focuswindow class:kitty; }|| { kitty -e tmux new-session -A -s default superfile;}
bind = $mainMod ALT, E, exec, kitty -e tmux new-session -A -s default \; neww superfile;

#application search
bind = $mainMod, SPACE, exec, pkill fuzzel ; fuzzel

#browser
bind = $mainMod, W, exec, firefox
bind = $mainMod ALT, W, exec, firefox -P dark
