# This config file include the input devices and custom hotkeys/keybinds

#====== Input-device config ======#
input {

    kb_layout		= de						# standart keymap parameter
    kb_variant		= us 						# specific keymap paramkb_options
    kb_options		= caps:hyper 					# bind caps to sup
    follow_mouse	= 2
    accel_profile	= flat

    touchpad {
        natural_scroll	= yes
    }


    sensitivity = 0							# -1.0 - 1.0, 0 means no modification.
}

#====== Funktion-keys ======#
# controls for the Thinkpad-keyboard
# TODO sleep mode, lock

# Brightness Control
bind=	,XF86MonBrightnessDown  ,exec ,brightnessctl  set 6%-	# F05
bind=	,XF86MonBrightnessUp  ,exec ,brightnessctl  set +6%		# F06

# Audio Control
bind= ,XF86AudioMute, exec, ~/.config/hypr/scripts/volumecontrol.sh mute				# F01
bind=	,XF86AudioLowerVolume,  exec, ~/.config/hypr/scripts/volumecontrol.sh down	# F02
bind=	,XF86AudioRaiseVolume,  exec, ~/.config/hypr/scripts/volumecontrol.sh up		# F03q

# Microphone Control
bind=	,XF86AudioMicMute	,exec	,pamixer --default-source -t			# F04

# Diplaylock
bind=	,code:235	,exec	, ~/.config/hypr/scripts/toggle-screen		# F07

# disable screen
bind=	,code:224	,exec	,~/.config/hypr/scripts/toggle-screen			#F09

# Quick-Start
bind=	,code:226	,exec	,signal-desktop			# F10
bind=	,code:231	,exec	,bitwarden-desktop	# F11

# Screenshot
bind=	,code:107	,exec	,grim -g "$(slurp)" - | wl-copy			# Druck-Key

#====== Keybinds ======#
# Keybinds for Hyprland

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = Mod3

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
# bind = $mainMod				, M				, exit						,
bind = $mainMod, Q, exec, kitty -e tmux new-session -A -s default
# bind = $mainMod, D, exec, vesktop
bind = $mainMod, R, exec, chwp -r
bind = $mainMod, D, killactive,
bind = $mainMod, F, fullscreen,
bind = $mainMod, E, exec, thunar
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, O, togglesplit, # dwindle
bind = $mainMod, W, exec, firefox
bind = $mainMod, SPACE, exec, pkill wofi ; wofi -I -S drun
bind = $mainMod ALT, W, exec, firefox -P dark
# bind = $mainMod ALT, L, exec, loginctl lock-session

# Switch to a specific workspace with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT       , 1           , movetoworkspace , 1
bind = $mainMod SHIFT       , 2           , movetoworkspace , 2
bind = $mainMod SHIFT       , 3           , movetoworkspace , 3
bind = $mainMod SHIFT       , 4           , movetoworkspace , 4
bind = $mainMod SHIFT       , 5           , movetoworkspace , 5
bind = $mainMod SHIFT       , 6           , movetoworkspace , 6
bind = $mainMod SHIFT       , 7           , movetoworkspace , 7
bind = $mainMod SHIFT       , 8           , movetoworkspace , 8
bind = $mainMod SHIFT       , 9           , movetoworkspace , 9
bind = $mainMod SHIFT       , 0           , movetoworkspace , 10

# move window to new workspace
bind = $mainMod SHIFT, N, movetoworkspace, emptyn

# move window to the relative monitor
bind = $mainMod SHIFT, l, movewindow, mon:r
bind = $mainMod SHIFT, h, movewindow, mon:l

# Switch workspaces relative to current one with mainMod + CTRL + [h,l]/[arrow keys]
bind = $mainMod ALT, h    , workspace, e-1
bind = $mainMod	ALT, l    , workspace, e+1
bind = $mainMod, left , workspace, e-1
bind = $mainMod, right, workspace, e+1
bind = $mainMod, mouse_up   , workspace, e-1
bind = $mainMod, mouse_down , workspace, e+1

# move to specific window on workspace
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u

# Move through monitors
bind = $mainMod CTRL, h, focusmonitor, l
bind = $mainMod CTRL, l, focusmonitor, r

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod            , mouse:272   , movewindow
bindm = $mainMod            , mouse:273   , resizewindow

# colorpicker
bind  = SHIFT               , code:107    , exec            , wl-copy $(hyprpicker)
bind=CTRL	,code:107	,exec	,grim -g "$(slurp)" - | swappy -f -		# Druck-Key
