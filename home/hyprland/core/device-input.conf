# This config file include the input devices and custom hotkeys/keybinds

#====== Input-device config ======#
input {

    kb_layout		= de						# standart keymap parameter
    kb_variant		= us 						# specific keymap paramkb_options
    kb_options		= caps:hyper 					# bind caps to sup
    follow_mouse	= 2
    accel_profile	= flat

    touchpad {
        natural_scroll	= yes
    }


    sensitivity = 0							# -1.0 - 1.0, 0 means no modification.
}

gestures {
    workspace_swipe = on						# activates 3 finger swipe for workspacechange
}

#====== Funktion-keys ======#
# controls for the Thinkpad-keyboard
# Brightness Control
bind=	,XF86MonBrightnessDown, exec,  brightnessctl set 5%-  # F05
bind=	,XF86MonBrightnessUp, exec,  brightnessctl set 5%+  # F06

# Audio Control
bind=,  XF86AudioPlay, exec, playerctl --all-players play-pause  # F04
bind=,  XF86AudioPause, exec, playerctl --all-players play-pause  # F04
bind=,  XF86AudioMute, exec, wpctl set-mute @DEFAULT_SINK@ toggle  # F01
bind=,  XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_SINK@ 5%- -l 1  # F02
bind=,  XF86AudioRaiseVolume,  exec, wpctl set-volume @DEFAULT_SINK@ 5%+ -l 1  # F03

# Microphone Control
bind=,  XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle  # F04


# disable screen
bind=,  XF86Display, exec, hyprctl dispatch dpms toggle  # F09

# Quick-Start
bind=,  XF86NotificationCenter,  exec,  discord # F07
bind=,  XF86PickupPhone,  exec,  signal-desktop  # F10
bind=,  XF86HangupPhone,  exec,  whatsapp-for-linux  # F11
bind=,  XF86Favorites,  exec, bitwarden-desktop # F12

# Screenshot
bind=,	Print,  exec, grim -g "$(slurp)" - | wl-copy  # Druck-Key

# colorpicker
bind  = SHIFT,  Print,  exec, wl-copy $(hyprpicker)
bind  = CTRL, Print	,exec	,grim -g "$(slurp)" - | swappy -f -		# Druck-Key

#====== Keybinds ======#
# Keybinds for Hyprland

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = Mod3

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
# bind = $mainMod				, M				, exit						,
bind = $mainMod, Q, exec, kitty -e tmux new-session -A -s default
# bind = $mainMod, D, exec, vesktop
bind = $mainMod, R, exec, chwp -r
bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = $mainMod, D, killactive,
bind = $mainMod, F, fullscreen,
# bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod, E, exec, thunar
bind = $mainMod SHIFT, E, exec, kitty -e tmux new-session -A -s default \ new-window -e superfile
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, O, togglesplit, # dwindle
bind = $mainMod, W, exec, firefox
# bind = $mainMod, SPACE, exec, pkill wofi ; wofi -I -S drun
bind = $mainMod, SPACE, exec, pkill fuzzel ; fuzzel
bind = $mainMod ALT, W, exec, firefox -P dark
bind = $mainMod, B, exec, toggle-waybar toggle
bind = $mainMod SHIFT CTRL, S, exec, shutdown 0
bind = $mainMod SHIFT, M, exec, hyprctl dispatch dpms toggle
# bind = $mainMod sLT, L, exec, loginctl lock-session

# pinning Windows on screen
bind = $mainMod SHIFT, P, submap, lockmode # set window always active
submap = lockmode
    bind = , P, exec, hyprctl dispatch togglefloating active && \
    hyprctl dispatch pin active &&
    bind = , Escape, submap, reset
submap = reset

# Switch to a specific workspace with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, g, workspace, name:game

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT       , 1           , movetoworkspace , 1
bind = $mainMod SHIFT       , 2           , movetoworkspace , 2
bind = $mainMod SHIFT       , 3           , movetoworkspace , 3
bind = $mainMod SHIFT       , 4           , movetoworkspace , 4
bind = $mainMod SHIFT       , 5           , movetoworkspace , 5
bind = $mainMod SHIFT       , 6           , movetoworkspace , 6
bind = $mainMod SHIFT       , 7           , movetoworkspace , 7
bind = $mainMod SHIFT       , 8           , movetoworkspace , 8
bind = $mainMod SHIFT       , 9           , movetoworkspace , 9
bind = $mainMod SHIFT       , 0           , movetoworkspace , 10
bind = $mainMod SHIFT       , g           , movetoworkspace , name:game

# move window to new workspace
bind = $mainMod SHIFT, N, movetoworkspace, emptyn

# move window to the relative monitor
bind = $mainMod SHIFT, l, movewindow, mon:r
bind = $mainMod SHIFT, h, movewindow, mon:l

# Switch workspaces relative to current one with mainMod + CTRL + [h,l]/[arrow keys]
bind = $mainMod ALT, h    , workspace, e-1
bind = $mainMod	ALT, l    , workspace, e+1
bind = $mainMod, left , workspace, e-1
bind = $mainMod, right, workspace, e+1
bind = $mainMod, mouse_up   , workspace, e-1
bind = $mainMod, mouse_down , workspace, e+1

# move to specific window on workspace
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u

# Move through monitors
bind = $mainMod CTRL, h, focusmonitor, l
bind = $mainMod CTRL, l, focusmonitor, r

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod            , mouse:272   , movewindow
bindm = $mainMod            , mouse:273   , resizewindow
