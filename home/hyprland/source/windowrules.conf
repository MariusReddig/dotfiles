# Windowrules 
windowrule = float  ,^(pavucontrol)$
windowrule = float  ,^(blueman-manager)$
windowrule = float  ,^(nm-connection-editor)$

windowrule = float  ,^(com.nextcloud.desktopclient.nextcloud)$
windowrule = center ,^(com.nextcloud.desktopclient.nextcloud)$

windowrule = move 1460 80   ,^(jetbrains-toolbox)$
windowrule = move 1460 80   ,^(com-jetbrains-toolbox-entry-ToolboxEntry)$

windowrulev2 = opacity 0.8,				class:^(kitty)$
windowrulev2 = opacity 1.0,	title:^(v{1,2}.*)$,	class:^(kitty)$
windowrulev2 = opacity 1.0,	title:^(nvim.*)$,	class:^(kitty)$

windowrulev2 = float,				title:^(Nextcloud)$,								class:^(com.nextcloud.desktopclient.nextcloud)$
# windowrulev2 = stayfocused, title: ^(Nextcloud)$,								class:^(com.nextcloud.desktopclient.nextcloud)$
windowrulev2 = rounding 9,	title: ^(Nextcloud)$,								class:^(com.nextcloud.desktopclient.nextcloud)$

windowrulev2 = float,	stayfocused,	size 600 520,	initialTitle:^(Calendar Reminders)$,	class:^thunderbird

# windowrule for every game running with run-game
windowrulev2 = workspace name:game, initialClass:^(gamescope)$

windowrulev2 = stayfocused, title:^()$,class:^(steam)$
windowrulev2 = minsize 1 1, title:^()$,class:^(steam)$
