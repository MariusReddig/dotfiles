[DEFAULT]
working_dir = ~/Documents/UNI/7.Semester/
on_conflict = no-delete
status = no

[auth:ilias]
type = keyring
username = ugkrj

[crawl:DBS]
  type = kit-ilias-web
  auth = auth:ilias
  target = 2652381
  transform =
    (.*) -re->> "{g1.lower().replace(' ', '-')}"

[crawl:TGI]
  type = kit-ilias-web
  auth = auth:ilias
  target = 2733272
  transform =
    (.*) -re->> "{g1.lower().replace(' ', '-')}"

[crawl:GKI]
  type = kit-ilias-web
  auth = auth:ilias
  target = 2775838
  transform =
    (.*) -re->> "{g1.lower().replace(' ', '-')}"

