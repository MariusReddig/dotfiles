#-System-required-processes-#
### system-needed ###
exec-once = dunst	# notification-agent
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1	# auth-agent
exec-once = firewalld		# firewall
exec-once = hypridle		# idle-mode
exec-once = hyprpm reload	# hyprland plugins

## desktop-portal for streaming ##
exec-once = start-xdg-desktop-portal
# exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

## load wallpaper ##
exec = swww-daemon  # wallpaper-agent
exec = chwp -r  # sets-wallpaper

## audio ##
exec-once = initialize-sinks # setup sinks for pipewire
exec-once = easyeffects --hide-window # easyeffects

## clipboard ##
exec-once = wl-paste --watch cliphist store

## docker ##
exec = pkill waybar; waybar	# dock

### applets ###
exec-once = bitwarden-desktop # bitwarden-apllet
exec = pkill blueman-applet; blueman-applet # bluetooth-applet
exec = pkill nm-applet; nm-applet # network-manager-applet

## Applications ##
exec-once = lact daemon		#GPU overclocking
exec-once = exec wl-paste --watch cliphist store #clipboard history
exec-once = pkill nextcloud; nextcloud				# nextcloud-client
exec-once = pkill steam; steam -silent
# exec-once = pkill vesktop; vesktop -m
exec-once = pkill signal-desktop; signal-desktop
exec-once = pkill wasistlos; wasistlos
# exec-once = pkill obs; obs --minimize-to-tray --disable-shutdown-check
# exec-once = dockerd-rootless
