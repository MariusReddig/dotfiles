[DEFAULT]
working_dir = ~/Documents/UNI/9.Semester/
on_conflict = no-delete
show_not_deleted = false
status = yes

[auth:ilias]
type = keyring
username = ugkrj

[crawl:BGB]
  type = kit-ilias-web
  auth = auth:ilias
  target = 2962646
  transform =
    (.*) -re->> "{g1.lower().replace(' ', '-')}"

