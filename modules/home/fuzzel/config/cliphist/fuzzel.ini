# fuzzel.ini - Clipboard History Launcher
[main]
### APPEARANCE ###
font = JetBrains Mono Nerd Font:size=14
layer = overlay
anchor = center
lines = 10
line-height = 20
letter-spacing = 0
width = 40
prompt=📋
image-size-ratio=5.0

[border]
width = 2
radius = 12

[colors]
background = 0F0F17ff
text = a9b1d6ff
selection = a1bdceff
selection-text = 0F0F17ff
border = a1bdceff
match = 7aa2f7ff

# Key bindings (if you want to restore delete functionality)
[key-bindings]
delete-line=custom-1
clear=custom-0

# Image display settings
[dmenu]
# Show icons (thumbnails) - this is crucial for images
icons=yes
# Make the icon area larger for better visibility
icon-size=256
# Space between icon and text
horizontal-pad=20
# Vertical padding for each item
vertical-pad=8

# Text formatting
parse-escape=no
password-character=•
password=no
hide-cursor=no
fuzzy=yes
# Add line numbers for better orientation
line-num=yes
